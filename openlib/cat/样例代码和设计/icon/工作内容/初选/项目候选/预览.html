<!doctype html>
<meta charset="utf-8">
<title>项目图标候选</title>
<style>
  body {
    margin: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f8fafc;
    color: #0f172a;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
  }
  .card {
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    overflow: hidden;
    background: white;
  }
  .sample {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 96px;
  }
  .dark {
    background: #111827;
  }
  .sample img {
    width: 56px;
    height: 56px;
    object-fit: contain;
  }
  .name {
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.35;
    border-top: 1px solid #e2e8f0;
    word-break: break-all;
  }
</style>
