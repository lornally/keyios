# XcodeGen 工程定义 —— 这是唯一真源, Keyios.xcodeproj 是它的产物(不提交)。
# 改工程(加文件/改设置)一律改这个文件, 然后跑 `xcodegen generate`。
name: Keyios

options:
  bundleIdPrefix: cn.isuyu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Keyios:
    type: application
    platform: iOS
    sources:
      - path: Keyios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.isuyu.keyios
        MARKETING_VERSION: "1.0.0"           # 商店显示的版本号; release.sh 可用 VERSION 覆盖
        CURRENT_PROJECT_VERSION: "1"         # 构建号; release.sh 每次用时间戳覆盖
        SWIFT_VERSION: "6.0"
        # Info.plist 由 Xcode 按下面的键现生成, 不用手写文件
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"          # 1 = 只 iPhone
        ENABLE_PREVIEWS: YES                 # 给 Xcode 的 #Preview / axe 用
        ONLY_ACTIVE_ARCH: YES                # 只编当前架构, 别浪费一半时间编 x86_64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon  # 图标在 Keyios/Assets.xcassets
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO  # 没自己写加密, 上传时不用再答出口合规
        CODE_SIGN_STYLE: Automatic
        # 和 macOS 版 Keydog 同一个开发者团队 (见 macOS 仓库的 打包/______需提示AI必读______.md)
        DEVELOPMENT_TEAM: S6C429H97P
        # iCloud 能力声明。模拟器关了签名, 这份 entitlements 不会生效,
        # 所以模拟器走 f2读日记.swift 里的宿主机目录回退; 真机签名后才会用 iCloud 容器。
        CODE_SIGN_ENTITLEMENTS: Keyios/Keyios.entitlements
        # 只有模拟器免签名 (省掉开发者账号依赖); 真机保持签名, 交给 Automatic 去要 profile
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
        CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: NO
